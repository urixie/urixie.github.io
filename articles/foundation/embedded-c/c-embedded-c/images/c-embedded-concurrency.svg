<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">volatile 与中断任务协作</title>
  <desc id="desc">中断只记录事件，主循环读取事件并处理共享数据</desc>
  <rect width="960" height="300" rx="22" fill="#0f172a"/>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="65" y="70" width="210" height="150" rx="15" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="170" y="108" fill="#dbeafe" font-size="19">硬件 / 中断 ISR</text><text x="170" y="145" fill="#93c5fd" font-size="15">读取状态</text><text x="170" y="173" fill="#93c5fd" font-size="15">写入 volatile 标志</text><text x="170" y="201" fill="#fca5a5" font-size="14">不做耗时业务</text>
    <rect x="375" y="70" width="210" height="150" rx="15" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="480" y="108" fill="#d1fae5" font-size="19">同步边界</text><text x="480" y="145" fill="#86efac" font-size="15">临界区 / 原子访问</text><text x="480" y="173" fill="#86efac" font-size="15">明确数据所有权</text><text x="480" y="201" fill="#fcd34d" font-size="14">必要时使用队列</text>
    <rect x="685" y="70" width="210" height="150" rx="15" fill="#3b0764" stroke="#c084fc" stroke-width="2"/><text x="790" y="108" fill="#f3e8ff" font-size="19">任务 / 主循环</text><text x="790" y="145" fill="#d8b4fe" font-size="15">读取标志</text><text x="790" y="173" fill="#d8b4fe" font-size="15">处理协议与业务</text><text x="790" y="201" fill="#d8b4fe" font-size="14">清除 / 确认事件</text>
    <path d="M275 145H365" stroke="#94a3b8" stroke-width="3"/><path d="M585 145H675" stroke="#94a3b8" stroke-width="3"/>
    <text x="330" y="130" fill="#cbd5e1" font-size="14">事件</text><text x="640" y="130" fill="#cbd5e1" font-size="14">安全交接</text>
  </g>
</svg>
