<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">C 语言故障证据链</title>
  <desc id="desc">从现象到复现、现场、定位、修复和回归的调试流程</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
  <rect width="960" height="280" rx="22" fill="#0f172a"/>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="35" y="82" width="135" height="78" rx="13" fill="#450a0a" stroke="#f87171" stroke-width="2"/><text x="102" y="114" fill="#fee2e2" font-size="17">现象</text><text x="102" y="139" fill="#fca5a5" font-size="13">死机 / 数据错</text>
    <rect x="205" y="82" width="135" height="78" rx="13" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="272" y="114" fill="#dbeafe" font-size="17">复现</text><text x="272" y="139" fill="#93c5fd" font-size="13">固定输入条件</text>
    <rect x="375" y="82" width="135" height="78" rx="13" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="442" y="114" fill="#d1fae5" font-size="17">取证</text><text x="442" y="139" fill="#86efac" font-size="13">log / PC / SP</text>
    <rect x="545" y="82" width="135" height="78" rx="13" fill="#422006" stroke="#f59e0b" stroke-width="2"/><text x="612" y="114" fill="#fef3c7" font-size="17">定位</text><text x="612" y="139" fill="#fcd34d" font-size="13">边界 / 所有权</text>
    <rect x="715" y="82" width="210" height="78" rx="13" fill="#3b0764" stroke="#c084fc" stroke-width="2"/><text x="820" y="114" fill="#f3e8ff" font-size="17">修复与回归</text><text x="820" y="139" fill="#d8b4fe" font-size="13">测试 + 告警归零</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"><path d="M170 121H195"/><path d="M340 121H365"/><path d="M510 121H535"/><path d="M680 121H705"/></g>
  <text x="480" y="225" fill="#cbd5e1" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" text-anchor="middle">没有可重复输入和现场证据，就无法证明修复真的解决了根因</text>
</svg>
