<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="description" content="XYJ 的嵌入式工程项目、技术栈、项目经验与实用工具。">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)">
  <title>XYJ</title>
  <script src="assets/js/theme-init.js?v=680ffcd78f60"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=680ffcd78f60">
  <link rel="stylesheet" href="assets/css/home.css?v=680ffcd78f60">
</head>
<body class="home-page">
  <button class="skip-link" type="button" data-skip-to-main>跳到正文</button>

  <header class="mobile-header" id="mobileHeader">
    <button class="icon-button" type="button" data-panel-toggle="nav" aria-controls="siteSidebar" aria-label="打开导航">
      <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="mobile-title" id="mobileTitle">XYJ</span>
    <button class="icon-button" type="button" data-search-open aria-label="搜索文章">
      <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14Zm9 16-4.35-4.35"/></svg>
    </button>
    <button class="icon-button" type="button" data-theme-toggle aria-label="切换主题"></button>
  </header>

  <div class="home-shell">
    <aside class="site-sidebar" id="siteSidebar" aria-label="站点导航">
      <div class="sidebar-head">
        <div class="profile-row">
          <img class="profile-avatar" src="assets/img/avatar-surf.jpg?v=680ffcd78f60" alt="XYJ 网站头像" width="44" height="44">
          <div class="profile-identity">
            <h1>XYJ</h1>
            <p class="profile-summary">嵌入式软件工程师 · <span id="work-experience"></span>经验</p>
          </div>
        </div>
        <button class="icon-button sidebar-close" type="button" data-panel-toggle="nav" aria-label="关闭导航" data-panel-focus>
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <button class="search-trigger" type="button" data-search-open>
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14Zm9 16-4.35-4.35"/></svg>
        <span>搜索文章与章节</span>
        <kbd>Ctrl K</kbd>
      </button>

      <nav id="siteNav" class="site-nav" aria-label="文章目录"></nav>

      <div class="sidebar-footer">
        <a class="profile-email" href="mailto:xyj.work@qq.com" aria-label="发送邮件到 xyj.work@qq.com">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg>
          <span>xyj.work@qq.com</span>
        </a>
        <div class="sidebar-meta">
          <span>© <span data-current-year></span> XYJ</span>
          <button class="icon-button" type="button" data-theme-toggle aria-label="切换主题"></button>
        </div>
      </div>
    </aside>

    <main class="home-content" id="main" tabindex="-1">
      <div id="articleView" class="article-view" aria-live="polite"></div>
    </main>

    <aside class="toc-panel" id="tocPanel" aria-label="本文目录">
      <div class="toc-panel-head">
        <span>本文目录</span>
        <button class="icon-button toc-close" type="button" data-panel-toggle="toc" aria-label="关闭目录">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <nav id="tocNav" class="toc-nav" aria-label="本文章节"></nav>
    </aside>
  </div>

  <dialog class="search-dialog" id="searchDialog" aria-label="搜索文章">
    <div class="search-box">
      <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14Zm9 16-4.35-4.35"/></svg>
      <input id="searchInput" type="search" placeholder="搜索标题、标签、章节…" autocomplete="off" aria-controls="searchResults" aria-label="搜索关键词">
      <button class="search-close" id="searchClose" type="button" aria-label="关闭搜索">Esc</button>
    </div>
    <ul id="searchResults" class="search-results" role="listbox" aria-label="搜索结果"></ul>
    <p class="search-hint">↑ ↓ 选择 · Enter 打开 · Esc 关闭</p>
  </dialog>

  <script src="assets/js/home-data.js?v=680ffcd78f60"></script>
  <script src="assets/js/legacy-routes.js?v=680ffcd78f60"></script>
  <script src="assets/js/route-compat.js?v=680ffcd78f60"></script>
  <script src="assets/js/main.js?v=680ffcd78f60"></script>
  <script src="assets/js/article-reader.js?v=680ffcd78f60"></script>
  <script src="assets/js/home.js?v=680ffcd78f60"></script>
</body>
</html>
