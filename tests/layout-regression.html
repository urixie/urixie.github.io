<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>Layout regression harness</title>
  <style>
    html, body { margin: 0; padding: 0; background: #111; color: #eee; font-family: monospace; }
    iframe { display: block; border: 0; background: #fff; }
    #layout-result { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <iframe id="siteFrame" title="layout regression target"></iframe>
  <pre id="layout-result" data-status="pending">pending</pre>
  <script>
    /* 首页布局与交互回归：
       mobile / tablet (< 900px)  顶栏 + 抽屉导航 + 底部目录弹层 + 底部工具条，首屏必须看到正文标题；
       laptop (900–1279px)        常驻左侧导航，目录为右侧浮层，工具条在右下角；
       desktop / wide (≥ 1280px)  三栏，右侧目录常驻并随滚动高亮，工具条隐藏。
       所有宽度：整页可滚动、无横向滚动、可点击区域 ≥ 44px、目录与标题一一对应。 */
    (() => {
      const params = new URLSearchParams(location.search);
      const width = Number(params.get('width') || 1440);
      const height = Number(params.get('height') || 900);
      const mode = params.get('mode') || 'desktop';
      const frame = document.querySelector('#siteFrame');
      const result = document.querySelector('#layout-result');
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;
      frame.src = '../index.html#foundation/c-basic/c-basic-syntax';

      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
      const compact = width < 900;
      const threeColumn = width >= 1280;

      async function waitForArticle(doc) {
        const deadline = Date.now() + 10000;
        while (Date.now() < deadline) {
          if (doc.querySelector('.inline-article-body h2') && doc.querySelector('#tocNav a')) return;
          const error = doc.querySelector('.view-placeholder.is-error');
          if (error) throw new Error(`article load failed: ${error.textContent.trim()}`);
          await sleep(80);
        }
        throw new Error('timed out waiting for inline article');
      }

      /* CI 用 --virtual-time-budget 运行 headless Chrome，CSS 过渡与平滑滚动不会随虚拟时间推进，
         这里关闭过渡并走“减少动态效果”分支（即时滚动），只校验布局与交互结果，不校验动画时序。 */
      function disableMotion(doc) {
        const win = doc.defaultView;
        const style = doc.createElement('style');
        style.textContent = '*, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }';
        doc.head.appendChild(style);
        const nativeMatchMedia = win.matchMedia.bind(win);
        win.matchMedia = query => (String(query).includes('prefers-reduced-motion')
          ? { matches: true, media: query, addEventListener() {}, removeEventListener() {} }
          : nativeMatchMedia(query));
      }

      async function runAssertions(doc) {
        const win = doc.defaultView;
        const failures = [];
        const assert = (condition, message) => {
          if (!condition) failures.push(message);
        };
        const element = selector => doc.querySelector(selector);
        const rect = selector => {
          const node = typeof selector === 'string' ? element(selector) : selector;
          if (!node) return null;
          const value = node.getBoundingClientRect();
          return { top: value.top, right: value.right, bottom: value.bottom, left: value.left, width: value.width, height: value.height };
        };
        const style = (selector, property) => {
          const node = typeof selector === 'string' ? element(selector) : selector;
          return node ? win.getComputedStyle(node)[property] : '';
        };
        const isShown = selector => {
          const node = typeof selector === 'string' ? element(selector) : selector;
          if (!node) return false;
          const computed = win.getComputedStyle(node);
          const box = node.getBoundingClientRect();
          return computed.display !== 'none' && computed.visibility !== 'hidden' && box.width > 0 && box.height > 0
            && box.right > 0 && box.left < width && box.bottom > 0 && box.top < height;
        };
        const settle = () => sleep(350);

        const sidebar = rect('.site-sidebar');
        const content = rect('.home-content');
        const toc = rect('.toc-panel');
        const body = rect('.inline-article-body');
        const title = rect('.inline-article-body h1');
        const headings = Array.from(doc.querySelectorAll('.inline-article-body h2, .inline-article-body h3'));
        const tocLinks = Array.from(doc.querySelectorAll('#tocNav a'));
        const articleLinks = Array.from(doc.querySelectorAll('.nav-article'));
        const nonCanonical = articleLinks
          .map(link => link.getAttribute('href') || '')
          .filter(href => {
            const parsed = new URL(href, doc.baseURI);
            return Boolean(parsed.search || parsed.hash);
          });

        assert(Boolean(element('.nav-article.active')), 'missing active article in navigation tree');
        assert(element('.nav-topic.is-current')?.classList.contains('is-expanded'), 'current topic must be expanded');
        assert(articleLinks.length > 0, 'navigation must expose canonical article links');
        assert(nonCanonical.length === 0, `article hrefs must not contain query/fragment: ${nonCanonical.join(', ')}`);
        assert(Boolean(body && title), 'inline article body or title is missing');
        assert(headings.length > 1 && tocLinks.length === headings.length, `TOC links (${tocLinks.length}) must match headings (${headings.length})`);
        assert(tocLinks.every((link, index) => link.getAttribute('href') === `#${headings[index].id}`), 'TOC links must point to heading ids');
        assert(style('body', 'overflowY') !== 'hidden' && style('html', 'overflowY') !== 'hidden', 'page must scroll normally (no locked body)');
        assert(doc.documentElement.scrollHeight > height + 200, 'whole article must be rendered in one continuous page');
        assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1,
          `horizontal overflow: ${doc.documentElement.scrollWidth}/${doc.documentElement.clientWidth}`);
        if (body) {
          assert(body.width <= 50 * 16 + 1, `article measure too wide: ${body.width}`);
          assert(body.left >= (sidebar && !compact ? sidebar.right : 0) + 12, `article too close to the left edge: ${body.left}`);
        }

        const copyButton = rect('.copy-code-button');
        if (copyButton) assert(copyButton.right <= width - 4 && copyButton.width >= 40, `copy button out of bounds: ${JSON.stringify(copyButton)}`);

        if (compact) {
          assert(isShown('.mobile-header'), 'compact layout must show the top bar');
          assert(!isShown('.site-sidebar'), 'compact layout must hide the navigation drawer by default');
          assert(!isShown('.toc-panel'), 'compact layout must hide the TOC sheet by default');
          assert(isShown('.reader-dock'), 'compact layout must show the reader dock');
          assert(title && title.top < height * 0.35, `article title must be in the first screen, top=${title?.top}`);
          doc.querySelectorAll('.mobile-header button, .reader-dock-button').forEach(button => {
            const box = button.getBoundingClientRect();
            assert(box.height >= 44 && box.width >= 44, `tap target too small: ${button.getAttribute('aria-label')} ${box.width}x${box.height}`);
          });

          element('.mobile-header [data-panel-toggle="nav"]').click();
          await settle();
          assert(doc.body.classList.contains('nav-open') && isShown('.site-sidebar'), 'menu button must open the navigation drawer');
          assert(isShown('.page-overlay'), 'drawer must show the overlay');
          assert(doc.documentElement.classList.contains('is-scroll-locked'), 'drawer must lock background scrolling');
          element('.page-overlay').click();
          await settle();
          assert(!doc.body.classList.contains('nav-open') && !isShown('.site-sidebar'), 'overlay click must close the drawer');

          element('.reader-dock [data-panel-toggle="toc"]').click();
          await settle();
          assert(doc.body.classList.contains('toc-open') && isShown('.toc-panel'), 'dock TOC button must open the TOC sheet');
          const sheet = rect('.toc-panel');
          assert(sheet && Math.abs(sheet.bottom - height) <= 2, 'TOC sheet must be anchored to the bottom');
          doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
          await settle();
          assert(!doc.body.classList.contains('toc-open'), 'Escape must close the TOC sheet');
        } else {
          assert(style('.home-shell', 'display') === 'grid', 'wide layout must use grid');
          assert(!isShown('.mobile-header'), 'wide layout must hide the mobile top bar');
          assert(isShown('.site-sidebar') && sidebar && Math.abs(sidebar.width - 280) <= 2, `sidebar must be visible at 280px, got ${sidebar?.width}`);
          assert(style('.site-sidebar', 'position') === 'sticky', 'sidebar must be sticky');
          assert(content && sidebar && content.left >= sidebar.right - 1, 'content must follow the sidebar');
        }

        if (!compact && !threeColumn) {
          assert(!isShown('.toc-panel'), 'laptop layout must hide the TOC panel until requested');
          assert(isShown('.reader-dock'), 'laptop layout must show the reader dock');
          element('.reader-dock [data-panel-toggle="toc"]').click();
          await settle();
          const panel = rect('.toc-panel');
          assert(isShown('.toc-panel') && panel && panel.left > width / 2, 'laptop TOC must open as a right-side panel');
          element('.page-overlay').click();
          await settle();
        }

        if (threeColumn) {
          assert(isShown('.toc-panel'), 'three-column layout must show the TOC permanently');
          assert(toc && content && toc.left >= content.right - 1, 'TOC must sit to the right of the content');
          assert(!isShown('.reader-dock'), 'three-column layout must hide the reader dock');

          const target = headings[2];
          win.scrollTo(0, target.getBoundingClientRect().top + win.scrollY - 30);
          await settle();
          const active = element('#tocNav a.active');
          assert(active === tocLinks[2], `scroll spy must highlight the third heading, got ${active?.textContent}`);
          assert(decodeURIComponent(win.location.hash).endsWith(`/${target.id}`), `section must be written to the route: ${win.location.hash}`);

          tocLinks[4].click();
          await sleep(900);
          const clicked = headings[4].getBoundingClientRect().top;
          assert(clicked >= 0 && clicked < 80, `TOC click must scroll heading to the top, top=${clicked}`);
          assert(element('#tocNav a.active') === tocLinks[4], 'TOC click must activate the clicked entry');
        }

        return {
          mode,
          width,
          height,
          failures,
          metrics: {
            sidebar,
            content,
            toc,
            body,
            title,
            headingCount: headings.length,
            tocCount: tocLinks.length,
            articleLinkCount: articleLinks.length,
            rootScrollWidth: doc.documentElement.scrollWidth,
            rootClientWidth: doc.documentElement.clientWidth,
            hash: win.location.hash,
          },
        };
      }

      frame.addEventListener('load', async () => {
        try {
          const doc = frame.contentDocument;
          await waitForArticle(doc);
          disableMotion(doc);
          await sleep(150);
          const report = await runAssertions(doc);
          result.dataset.status = report.failures.length ? 'fail' : 'pass';
          result.textContent = JSON.stringify(report, null, 2);
          document.title = report.failures.length ? 'LAYOUT_FAIL' : 'LAYOUT_PASS';
        } catch (error) {
          result.dataset.status = 'fail';
          result.textContent = JSON.stringify({ mode, width, height, failures: [String(error)] }, null, 2);
          document.title = 'LAYOUT_FAIL';
        }
      }, { once: true });
    })();
  </script>
</body>
</html>
