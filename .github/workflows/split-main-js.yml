name: Split main.js migration

on:
  push:
    paths:
      - '.github/workflows/split-main-js.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 拆分 main.js
        run: python scripts/split_main_js.py
      - name: 校验隐私配置
        run: python scripts/website_privacy_guard.py --check
      - name: 校验目录与脚本结构
        run: python scripts/validate_site_structure.py
      - name: 提交拆分结果
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No split changes to commit.'
            exit 0
          fi
          git config user.name 'xyj'
          git config user.email '64504526+urixie@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: split home runtime from main'
          git push origin HEAD:main
