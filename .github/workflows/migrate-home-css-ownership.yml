name: One-shot home CSS ownership migration

on:
  push:
    paths:
      - scripts/migrate_home_css_ownership.py
      - .github/workflows/migrate-home-css-ownership.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 迁移首页 CSS 规则
        run: python scripts/migrate_home_css_ownership.py
      - name: 检查 CSS 与站点结构
        run: |
          python scripts/validate_home_css.py
          python scripts/validate_style_css_usage.py
          python scripts/validate_asset_budget.py
          git diff --check
      - name: 提交迁移结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/style.css assets/css/home.css
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "refactor: isolate homepage css ownership"
          git push
