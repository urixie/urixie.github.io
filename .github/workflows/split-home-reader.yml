name: Split home reader

on:
  push:
    branches:
      - refactor/home-reader-split
    paths:
      - scripts/split_home_reader.py
      - .github/workflows/split-home-reader.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: refactor/home-reader-split
      - name: 拆分文章 reader
        run: python scripts/split_home_reader.py
      - name: 校验隐私配置
        run: python scripts/website_privacy_guard.py --check
      - name: 校验目录与脚本结构
        run: python scripts/validate_site_structure.py
      - name: 提交拆分结果
        run: |
          if git diff --quiet; then
            echo "No migration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/home.js assets/js/article-reader.js index.html scripts/validate_site_structure.py
          git commit -m "refactor: split inline article reader"
          git push origin HEAD:refactor/home-reader-split
