name: One-shot site map migration

on:
  push:
    paths:
      - scripts/migrate_home_data_to_json.js
      - .github/workflows/migrate-site-map.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 从现有导航数据生成 JSON 清单
        run: node scripts/migrate_home_data_to_json.js
      - name: 从 JSON 重新生成运行时导航数据
        run: python scripts/generate_home_data.py
      - name: 检查生成结果
        run: |
          python scripts/generate_home_data.py --check
          git diff --check
      - name: 提交迁移结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-map.json assets/js/home-data.js
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "refactor: extract canonical site map manifest"
          git push
