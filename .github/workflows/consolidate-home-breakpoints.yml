name: Consolidate home breakpoints

on:
  push:
    branches:
      - refactor/home-breakpoints
    paths:
      - scripts/consolidate_home_breakpoints.py
      - .github/workflows/consolidate-home-breakpoints.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: refactor/home-breakpoints
      - name: 合并安全重复断点
        run: python scripts/consolidate_home_breakpoints.py
      - name: 检查 HTML noindex 配置
        run: python scripts/website_privacy_guard.py --check
      - name: 检查站点目录与路由一致性
        run: python scripts/validate_site_structure.py
      - name: 检查首页 CSS 无效覆盖
        run: python scripts/validate_home_css.py
      - name: 提交断点收敛结果
        run: |
          if git diff --quiet; then
            echo "No breakpoint consolidation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/home.css
          git commit -m "refactor: consolidate home css breakpoints"
          git push origin HEAD:refactor/home-breakpoints
