name: Migrate article cache coupling

on:
  push:
    branches:
      - refactor/decouple-article-cache
    paths:
      - .github/workflows/migrate-article-cache.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: refactor/decouple-article-cache
      - name: 解耦文章路由与静态资源缓存版本
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('assets/js/home-data.js')
          text = path.read_text(encoding='utf-8')

          before = len(re.findall(r"href\s*:\s*withVersion\(", text))
          if before == 0:
              raise SystemExit('No withVersion article hrefs found; aborting migration.')

          header_re = re.compile(
              r"\(function \(\) \{\n"
              r"  const stylesheet = document\.querySelector\('link\[href\*=\"assets/css/style\.css\"\]'\);\n"
              r"  const cacheVersion = stylesheet\n"
              r"    \? new URL\(stylesheet\.href, window\.location\.href\)\.searchParams\.get\('v'\)\n"
              r"    : '';\n"
              r"  const withVersion = path => cacheVersion \? `\$\{path\}\?v=\$\{cacheVersion\}` : path;\n\n"
          )
          text, header_count = header_re.subn('(function () {\n', text, count=1)
          if header_count != 1:
              raise SystemExit(f'Expected to remove cache-coupling header once, got {header_count}.')

          href_re = re.compile(r"href:\s*withVersion\((['\"])(articles/[^'\"]+\.html)\1\)")
          text, changed = href_re.subn(lambda m: f"href: '{m.group(2)}'", text)
          if changed != before:
              raise SystemExit(f'Expected to rewrite {before} article hrefs, rewrote {changed}.')

          forbidden = ('withVersion(', 'cacheVersion', 'assets/css/style.css')
          leftovers = [item for item in forbidden if item in text]
          if leftovers:
              raise SystemExit(f'Cache coupling remains in home-data.js: {leftovers}')

          path.write_text(text, encoding='utf-8')
          print(f'Rewrote {changed} article href(s) to pure canonical paths.')
          PY

          python scripts/website_privacy_guard.py --check
          python scripts/validate_javascript.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/home-data.js
          git commit -m "refactor: decouple article routes from asset cache versions"
          git push origin HEAD:refactor/decouple-article-cache
