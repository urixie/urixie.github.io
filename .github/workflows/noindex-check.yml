name: Static site checks

on:
  push:
  pull_request:

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 检查 HTML noindex 配置
        run: python scripts/website_privacy_guard.py --check
      - name: 检查站点目录与路由一致性
        run: python scripts/validate_site_structure.py
      - name: 检查首页 CSS 无效覆盖
        run: python scripts/validate_home_css.py
      - name: 检查公共 CSS 生产引用
        run: python scripts/validate_style_css_usage.py
      - name: 检查无人引用的运行时资源
        run: python scripts/validate_orphan_assets.py
      - name: 检查 JavaScript 语法
        run: python scripts/validate_javascript.py
