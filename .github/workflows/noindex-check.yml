name: Static site checks

on:
  push:
  pull_request:

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 检查文章脚手架模板
        run: >-
          python scripts/new_article.py
          --topic foundation
          --category c-basic
          --slug ci-article-scaffold-check
          --title "CI 文章脚手架检查"
          --description "验证文章模板、自动目录标记和站点目录解析逻辑。"
          --tags CI scaffold
          --dry-run
      - name: 检查导航数据生成一致性
        run: python scripts/generate_home_data.py --check
      - name: 检查静态资源缓存版本
        run: python scripts/bump_cache_version_from_git.py --check
      - name: 检查 HTML noindex 配置
        run: python scripts/website_privacy_guard.py --check
      - name: 检查站点目录与路由一致性
        run: python scripts/validate_site_structure.py
      - name: 检查页面内容质量与本地引用
        run: python scripts/validate_content.py
      - name: 检查文章目录、重复元数据与本地附件治理
        run: python scripts/validate_article_catalog.py
      - name: 检查首页 CSS 无效覆盖
        run: python scripts/validate_home_css.py
      - name: 检查 CSS 职责边界
        run: python scripts/validate_css_ownership.py
      - name: 检查公共 CSS 生产引用
        run: python scripts/validate_style_css_usage.py
      - name: 检查无人引用的运行时资源
        run: python scripts/validate_orphan_assets.py
      - name: 检查静态资源体积预算
        run: python scripts/validate_asset_budget.py
      - name: 检查 JavaScript 语法
        run: python scripts/validate_javascript.py
