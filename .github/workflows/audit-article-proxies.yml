name: Verify article proxy cleanup

on:
  push:
    branches:
      - refactor/remove-article-proxies
    paths:
      - .github/workflows/audit-article-proxies.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 检查 HTML noindex 配置
        run: python scripts/website_privacy_guard.py --check
      - name: 检查站点目录与路由一致性
        run: python scripts/validate_site_structure.py
      - name: 检查首页 CSS
        run: python scripts/validate_home_css.py
      - name: 检查公共 CSS 生产引用
        run: python scripts/validate_style_css_usage.py
      - name: 检查 JavaScript 语法
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0 | sort -z)
      - name: 检查首页与独立文章页布局
        run: python scripts/browser_layout_guard.py
