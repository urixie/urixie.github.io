name: Dedupe home CSS

on:
  push:
    branches:
      - refactor/home-css-dedup
    paths:
      - scripts/dedupe_home_css.py
      - .github/workflows/dedupe-home-css.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: refactor/home-css-dedup
      - name: 清理安全重复规则和死状态
        run: python scripts/dedupe_home_css.py
      - name: 校验隐私配置
        run: python scripts/website_privacy_guard.py --check
      - name: 校验目录与脚本结构
        run: python scripts/validate_site_structure.py
      - name: 提交清理结果
        run: |
          if git diff --quiet; then
            echo "No cleanup changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/home.css assets/js/home.js scripts/validate_site_structure.py
          git commit -m "refactor: remove duplicate home css rules"
          git push origin HEAD:refactor/home-css-dedup
