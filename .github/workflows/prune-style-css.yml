name: Prune legacy style css

on:
  push:
    branches:
      - refactor/prune-style-css
    paths:
      - scripts/prune_legacy_style_css.py
      - .github/workflows/prune-style-css.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: refactor/prune-style-css
      - name: 删除审计确认的旧样式
        run: python scripts/prune_legacy_style_css.py
      - name: 复查 style.css 生产引用
        run: |
          python scripts/audit_style_css_usage.py | tee /tmp/style-audit.txt
          grep -Fq "Fully dead candidate rules: 0" /tmp/style-audit.txt
          grep -Fq "Partially dead selector groups: 0" /tmp/style-audit.txt
      - name: 检查 HTML noindex 配置
        run: python scripts/website_privacy_guard.py --check
      - name: 检查站点目录与路由一致性
        run: python scripts/validate_site_structure.py
      - name: 检查首页 CSS
        run: python scripts/validate_home_css.py
      - name: 检查首页与独立文章页布局
        run: python scripts/browser_layout_guard.py
      - name: 提交结果
        run: |
          if git diff --quiet; then
            echo "No style pruning changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/style.css
          git commit -m "refactor: prune dead legacy styles"
          git push origin HEAD:refactor/prune-style-css
