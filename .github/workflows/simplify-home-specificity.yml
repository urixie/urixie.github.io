name: Simplify home CSS specificity

on:
  push:
    branches:
      - refactor/simplify-home-specificity
    paths:
      - scripts/simplify_home_specificity.py
      - .github/workflows/simplify-home-specificity.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: refactor/simplify-home-specificity
      - name: 降低首页 CSS 选择器优先级
        run: python scripts/simplify_home_specificity.py
      - name: 检查 HTML noindex 配置
        run: python scripts/website_privacy_guard.py --check
      - name: 检查站点目录与路由一致性
        run: python scripts/validate_site_structure.py
      - name: 检查首页 CSS
        run: python scripts/validate_home_css.py
      - name: 检查三种浏览器布局
        run: python scripts/browser_layout_guard.py
      - name: 提交结果
        run: |
          if git diff --quiet; then
            echo "No specificity cleanup changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/home.css
          git commit -m "refactor: simplify home css specificity"
          git push origin HEAD:refactor/simplify-home-specificity
