name: Remove obsolete home important flags

on:
  push:
    branches:
      - refactor/remove-home-important
    paths:
      - scripts/remove_home_important.py
      - .github/workflows/remove-home-important.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-home-important
      - name: 删除 home.css 的旧 important 标记
        run: python scripts/remove_home_important.py
      - name: 检查 HTML noindex 配置
        run: python scripts/website_privacy_guard.py --check
      - name: 检查站点目录与路由一致性
        run: python scripts/validate_site_structure.py
      - name: 检查首页 CSS
        run: python scripts/validate_home_css.py
      - name: 检查三种浏览器布局
        run: python scripts/browser_layout_guard.py
      - name: 提交结果
        run: |
          if git diff --quiet; then
            echo "No important cleanup changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/home.css
          git commit -m "refactor: remove obsolete home important flags"
          git push origin HEAD:refactor/remove-home-important
