name: One-shot local reference repair

on:
  push:
    paths:
      - scripts/repair_local_root_references.py
      - .github/workflows/repair-local-references.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 修复旧文章根目录引用
        run: python scripts/repair_local_root_references.py
      - name: 检查内容引用
        run: |
          python scripts/validate_content.py
          git diff --check
      - name: 提交修复结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles
          if git diff --cached --quiet; then
            echo "No article references required repair."
            exit 0
          fi
          git commit -m "fix: repair legacy article root references"
          git push
