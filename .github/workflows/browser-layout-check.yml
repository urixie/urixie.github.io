name: Browser layout checks

on:
  push:
    paths:
      - index.html
      - assets/css/**
      - assets/js/**
      - articles/**
      - tests/layout-regression.html
      - tests/article-layout-regression.html
      - tests/article-loading-race.html
      - tests/route-compat-regression.html
      - scripts/browser_layout_guard.py
      - .github/workflows/browser-layout-check.yml
  pull_request:
    paths:
      - index.html
      - assets/css/**
      - assets/js/**
      - articles/**
      - tests/layout-regression.html
      - tests/article-layout-regression.html
      - tests/article-loading-race.html
      - tests/route-compat-regression.html
      - scripts/browser_layout_guard.py
      - .github/workflows/browser-layout-check.yml

jobs:
  layout-regression:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 确认 Chrome 环境
        run: command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
      - name: 检查首页、独立文章页与文章切换交互
        run: python scripts/browser_layout_guard.py
