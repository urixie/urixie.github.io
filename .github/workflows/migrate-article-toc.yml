name: One-shot article TOC migration

on:
  push:
    paths:
      - scripts/migrate_article_toc.py
      - .github/workflows/migrate-article-toc.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 迁移旧文章到自动目录
        run: |
          python scripts/migrate_article_toc.py
          python scripts/bump_cache_version_from_git.py
          python scripts/validate_content.py
          python scripts/validate_article_catalog.py
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          python scripts/browser_layout_guard.py
          git diff --check
      - name: 提交迁移结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles
          if git diff --cached --quiet; then
            echo "No article migration changes were needed."
            exit 0
          fi
          git commit -m "refactor: migrate legacy articles to automatic toc"
          git push
