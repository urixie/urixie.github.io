name: Bump css cache version

on:
  push:
    branches:
      - chore/bump-style-cache
    paths:
      - scripts/bump_css_cache_version.py
      - .github/workflows/bump-css-cache.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: chore/bump-style-cache
      - name: 更新全站 CSS 缓存版本
        run: python scripts/bump_css_cache_version.py
      - name: 检查 HTML noindex 配置
        run: python scripts/website_privacy_guard.py --check
      - name: 检查站点目录与路由一致性
        run: python scripts/validate_site_structure.py
      - name: 检查首页 CSS
        run: python scripts/validate_home_css.py
      - name: 检查公共 CSS 生产引用
        run: python scripts/validate_style_css_usage.py
      - name: 检查首页与独立文章页布局
        run: python scripts/browser_layout_guard.py
      - name: 提交结果
        run: |
          if git diff --quiet; then
            echo "No CSS cache version changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' articles
          git commit -m "chore: refresh css cache tokens"
          git push origin HEAD:chore/bump-style-cache
