name: Move shared article styles

on:
  push:
    branches:
      - refactor/prune-style-css
    paths:
      - scripts/move_article_common_styles.py
      - scripts/validate_home_css.py
      - .github/workflows/move-article-common-styles.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: refactor/prune-style-css
      - name: 迁移公共文章交互样式
        run: python scripts/move_article_common_styles.py
      - name: 检查 HTML noindex 配置
        run: python scripts/website_privacy_guard.py --check
      - name: 检查站点目录与路由一致性
        run: python scripts/validate_site_structure.py
      - name: 检查首页 CSS
        run: python scripts/validate_home_css.py
      - name: 检查首页与独立文章页布局
        run: python scripts/browser_layout_guard.py
      - name: 提交结果
        run: |
          if git diff --quiet; then
            echo "No common article style migration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/style.css assets/css/home.css
          git commit -m "refactor: move shared article styles to base css"
          git push origin HEAD:refactor/prune-style-css
